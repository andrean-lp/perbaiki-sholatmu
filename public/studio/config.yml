# Decap CMS Configuration - Perbaiki Sholatmu
# https://decapcms.org/docs/configuration-options/

# Aktifkan local backend untuk development lokal via `npm run cms`
local_backend: true

# Konfigurasi backend repositori GitHub
backend:
  name: github
  repo: andrean-lp/perbaiki-sholatmu
  branch: main
  # Catatan: Jika di-deploy ke Netlify dengan Netlify Identity & Git Gateway, ubah menjadi:
  # name: git-gateway

# Direktori penyimpanan media/gambar
media_folder: "public/uploads"
public_folder: "/uploads"

# Tampilan di dashboard CMS
site_url: "https://perbaiki-sholatmu.pages.dev"
display_url: "https://github.com/andrean-lp/perbaiki-sholatmu"

collections:
  - name: "blog"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "string", required: false }
      - { label: "Tanggal Publikasi", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Cover Gambar", name: "heroImage", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Isi Konten", name: "body", widget: "markdown" }
